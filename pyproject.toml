[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evals"
version = "0.1.0"
description = "Suite de avaliacao do MCP server de legislacao tributaria (P3)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["httpx"]

[project.scripts]
evals = "evals.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-timeout"]

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
